name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - name: Manter arquivos das versões anteriores (página aberta numa versão antiga não fica em branco)
        run: |
          SITE="https://thainaraasalmeida-ai.github.io/rotas-shopee"
          { curl -fsSL "$SITE/kept-assets.txt" || true; curl -fsSL "$SITE/sw.js" | grep -o 'assets/[^",]*' || true; } | sort -u > /tmp/kept.txt
          while read -r f; do [ -n "$f" ] && [ ! -f "dist/$f" ] && curl -fsSL "$SITE/$f" -o "dist/$f" --create-dirs || true; done < /tmp/kept.txt
          { ls dist/assets | sed 's#^#assets/#'; cat /tmp/kept.txt; } | sort -u > dist/kept-assets.txt
          wc -l dist/kept-assets.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
